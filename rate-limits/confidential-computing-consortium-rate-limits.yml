description: >-
  The Confidential Computing Consortium publishes no rate limits, because it operates no metered
  API. The only HTTP API surface on its estate is the WordPress REST API behind its own website
  (https://confidentialcomputing.io/wp-json/, advertised via /.well-known/api-catalog), which
  carries no documented limits and returned no RateLimit-*/X-RateLimit-*/Retry-After headers on
  an anonymous GET probe on 2026-09-05. An honest zero, not an unmeasured gap.
notes: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted free/professional/enterprise
  tiers at 10/100/1000 requests per minute with X-RateLimit-* signaling. None of that was ever
  published by the CCC.
