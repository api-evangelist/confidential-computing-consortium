specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Confidential Computing Consortium
providerId: confidential-computing-consortium
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Attestation
  - Confidential Computing
  - Hardware
  - Linux Foundation
  - Open Source
  - Privacy
  - Security
  - TEE
