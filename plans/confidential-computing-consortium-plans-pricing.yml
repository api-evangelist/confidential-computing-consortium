description: >-
  The Confidential Computing Consortium publishes no API access plans — it operates no metered,
  priced API. What it does publish, verbatim on https://confidentialcomputing.io/join/, is a
  membership dues schedule for joining the consortium itself. Those tiers are recorded below as
  the provider's real published pricing; they buy governance participation, not API quota. This
  file replaces a 2026-05-04 bulk-sweep scaffold that asserted Free/Professional/Enterprise API
  tiers with invented request quotas and rate limits the CCC has never published.
notes: >-
  All member organizations must also be Linux Foundation members. General membership dues are
  banded by consolidated employee headcount.
