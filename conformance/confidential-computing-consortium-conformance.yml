notes: >-
  The CCC is a governance body, not an API operator. Its only machine-readable HTTP surface is the
  WordPress REST API behind its own website (https://confidentialcomputing.io/wp-json/, 128 routes,
  advertised through the RFC 9727 api-catalog above). Its member roster is served publicly and
  anonymously by the Linux Foundation's own LFX Project Service —
  https://api-gw.platform.linuxfoundation.org/project-service/v1/public/projects/a092M00001IfDuzQAF/members
  (HTTP 200, 83KB, consumed by the members carousel on the CCC homepage). That API belongs to the
  Linux Foundation, not to the CCC, and is recorded here only as evidence of the consortium's
  CONSUMING position; no contract from it is claimed or saved under this provider.
